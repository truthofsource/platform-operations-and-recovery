name: Local-contract validation
# Manual-only to avoid spending Actions minutes for documentation edits.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Verify extracted platform source
        run: npm run test:source
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify positive and negative paths
        run: python -B -m unittest discover -s tests -v
      - name: Execute synthetic demonstration
        run: python -B -m lab demo
